<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 16px;
    }
    h2 {
      text-align: center;
      color: #00d4ff;
      margin-bottom: 12px;
      font-size: 18px;
      letter-spacing: 1px;
    }
    .version {
      text-align: center;
      color: #666;
      font-size: 11px;
      margin-top: -8px;
      margin-bottom: 12px;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 14px;
    }
    .stat-box {
      background: #16213e;
      border-radius: 10px;
      padding: 10px 18px;
      text-align: center;
      min-width: 90px;
    }
    .stat-box .number {
      font-size: 24px;
      font-weight: bold;
      color: #00d4ff;
    }
    .stat-box .label {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }
    .section {
      background: #16213e;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 12px;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .toggle-row label {
      font-size: 13px;
      cursor: pointer;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #333;
      border-radius: 22px;
      transition: .3s;
    }
    .slider:before {
      content: "";
      position: absolute;
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background: #eee;
      border-radius: 50%;
      transition: .3s;
    }
    input:checked + .slider { background: #00d4ff; }
    input:checked + .slider:before { transform: translateX(18px); }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 6px;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }
    .btn:hover { transform: translateY(-1px); opacity: 0.9; }
    .btn-csv {
      background: linear-gradient(135deg, #00d4ff, #0077b6);
      color: white;
    }
    .btn-sheets {
      background: linear-gradient(135deg, #34a853, #0f9d58);
      color: white;
    }
    .btn-clear {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: white;
    }
    .status {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 6px;
      min-height: 16px;
    }
    .status.success { color: #34a853; }
    .status.error { color: #e74c3c; }
    .status.loading { color: #f39c12; }

    .encrypted-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 10px;
      color: #34a853;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h2>Contact Collector Pro</h2>
  <div class="version">v3.0 — Encrypted &amp; Advanced</div>

  <div class="stats">
    <div class="stat-box">
      <div class="number" id="phoneCount">0</div>
      <div class="label">Phones</div>
    </div>
    <div class="stat-box">
      <div class="number" id="emailCount">0</div>
      <div class="label">Emails</div>
    </div>
    <div class="stat-box">
      <div class="number" id="totalCount">0</div>
      <div class="label">Total</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Settings</div>
    <div class="toggle-row">
      <label for="toggleCollection">Collection Enabled</label>
      <label class="switch">
        <input type="checkbox" id="toggleCollection">
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <label for="toggleDeepCrawl">Deep Crawl (Sub-pages)</label>
      <label class="switch">
        <input type="checkbox" id="toggleDeepCrawl">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Export</div>
    <button class="btn btn-csv" id="exportCsv">Export as CSV</button>
    <button class="btn btn-sheets" id="exportSheets">Export to Google Sheets</button>
  </div>

  <div class="section">
    <div class="section-title">Manage</div>
    <button class="btn btn-clear" id="clearData">Clear All Data</button>
  </div>

  <div class="status" id="status"></div>

  <div class="encrypted-badge">
    AES-256 Encrypted Storage
  </div>

  <script src="popup.js"></script>
</body>
</html>
